# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase web config. Not secret: the same values ship in the browser bundle.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBD7GIPoxwMN1wJALIYnXZQ_U7flf0TRTo
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: catalog-app-99.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: catalog-app-99
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: catalog-app-99.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "295794153854"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:295794153854:web:d6427603b5a1d06898bb2f
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://your-backend--your-project.us-central1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
